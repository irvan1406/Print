<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>VanNota — Offline</title>
    <style>
        :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#172033;font-family:system-ui,-apple-system,sans-serif}.card{width:min(100%,420px);padding:30px;border:1px solid #dde4ee;border-radius:24px;background:#fff;box-shadow:0 18px 50px #16223514;text-align:center}.icon{width:62px;height:62px;margin:0 auto 18px;display:grid;place-items:center;border-radius:19px;background:#edf3ff;color:#2f6fea;font-size:30px}h1{margin:0 0 8px;font-size:24px}p{margin:0 0 22px;color:#667085;line-height:1.55}button{width:100%;min-height:48px;border:0;border-radius:13px;color:#fff;background:#2f6fea;font:800 14px system-ui}@media(prefers-color-scheme:dark){body{background:#0c111b;color:#f3f6fb}.card{background:#141b27;border-color:#2c384b}p{color:#9ca9bb}}
    </style>
</head>
<body>
    <main class="card">
        <div class="icon">↻</div>
        <h1>Belum ada internet</h1>
        <p>Sambungkan ponsel ke internet agar VanNota dapat memuat tampilan terbaru. Printer Bluetooth tetap dapat dipilih setelah halaman terbuka.</p>
        <button onclick="location.href='https://irvan1406.github.io/Print/'">Coba lagi</button>
    </main>
</body>
</html>
