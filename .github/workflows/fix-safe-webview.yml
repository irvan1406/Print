name: Fix Safe WebView

on:
  push:
    paths:
      - '.github/workflows/fix-safe-webview.yml'
      - '.github/scripts/fix_safe_webview.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe WebView repair
        run: python .github/scripts/fix_safe_webview.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/app/src/main/java/com/cetakpro/print/MainActivity.java android/app/src/main/java/com/cetakpro/print/NotificationListenerService.java android/app/src/main/AndroidManifest.xml
          git commit -m "Restore WebView printer bridge and remove notification forwarding"
          git push
