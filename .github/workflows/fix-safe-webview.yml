name: Fix Safe WebView

on:
  push:
    paths:
      - '.github/workflows/fix-safe-webview.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep app navigation in WebView and disable cross-app notification forwarding
        shell: python
        run: |
          from pathlib import Path

          p = Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          old = '''                    Uri uri = request.getUrl();
                    String host = uri.getHost();
                    if (host != null && (host.equals("irvanmaulana.my.id") || host.endsWith(".jsdelivr.net"))) return false;
                    try {
                        startActivity(new Intent(Intent.ACTION_VIEW, uri));
                        return true;
                    } catch (Exception ignored) {
                        return false;
                    }'''
          new = '''                    Uri uri = request.getUrl();
                    String scheme = uri.getScheme();
                    if (scheme != null && (scheme.equalsIgnoreCase("http") || scheme.equalsIgnoreCase("https"))) {
                        view.loadUrl(uri.toString());
                        return true;
                    }
                    return false;'''
          if old not in s:
              raise SystemExit('WebView navigation block not found')
          s = s.replace(old, new, 1)

          # Remove initialization/dialogs that activate cross-app notification access.
          s = s.replace('            TelegramSender.init(this); // <-- INI YANG KAMU TANYAKAN\n', '')
          s = s.replace('''            if (!isNotificationListenerEnabled()) {
                showNotificationAccessDialog();
            }
            
''', '', 1)
          s = s.replace('                    mainHandler.postDelayed(() -> checkNotificationAccessStatus(), 1500);\n', '')
          s = s.replace('''            if (!isNotificationListenerEnabled()) {
                showNotificationAccessDialog();
            }

''', '', 1)
          s = s.replace('                    showNotificationAccessDialog();\n', '', 1)
          p.write_text(s, encoding='utf-8')

          m = Path('android/app/src/main/AndroidManifest.xml')
          x = m.read_text(encoding='utf-8')
          x = x.replace('    <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE" />\n', '')
          service = '''        <service
            android:name=".NotificationListenerService"
            android:label="@string/app_name"
            android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.service.notification.NotificationListenerService" />
            </intent-filter>
        </service>

'''
          x = x.replace(service, '')
          m.write_text(x, encoding='utf-8')

      - name: Commit only safe WebView fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/cetakpro/print/MainActivity.java android/app/src/main/AndroidManifest.xml
          git commit -m "Keep web app inside WebView and disable notification forwarding"
          git push
