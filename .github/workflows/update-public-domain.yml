name: Update Public Domain URLs

on:
  push:
    paths:
      - '.github/workflows/update-public-domain.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update public domain URLs only
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java'),
              Path('android/app/build.gradle.kts'),
          ]

          replacements = [
              ('https://irvan1406.github.io/Print/', 'https://irvanmaulana.my.id/'),
              ('https://irvan1406.github.io/Print', 'https://irvanmaulana.my.id'),
              ('irvan1406.github.io', 'irvanmaulana.my.id'),
          ]

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No matching old-domain URLs found in target files')

          print('Updated:')
          for item in changed:
              print(' -', item)

      - name: Commit domain URL updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html android/app/src/main/java/com/cetakpro/print/MainActivity.java android/app/build.gradle.kts
          git commit -m "Update app URLs to irvanmaulana.my.id"
          git push
