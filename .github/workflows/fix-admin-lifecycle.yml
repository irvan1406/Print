name: Fix Admin Lifecycle Crash

on:
  push:
    paths:
      - '.github/workflows/fix-admin-lifecycle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move Device Admin request after UI init only
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java')
          text = path.read_text(encoding='utf-8')

          old = '''        // Aktifkan Device Admin\n        activateDeviceAdmin();\n\n        // Aktifkan Internet selalu ON (Wake Lock + Internet)\n'''
          new = '''        // Device Admin diminta setelah UI siap agar lifecycle Activity stabil\n\n        // Aktifkan Internet selalu ON (Wake Lock + Internet)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly 1 old admin block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = '''        webView = new WebView(this);\n        webView.setBackgroundColor(Color.rgb(244, 247, 251));\n        setContentView(webView);\n'''
          replacement = anchor + '''\n        // Aktifkan Device Admin setelah content view selesai dibuat\n        mainHandler.post(this::activateDeviceAdmin);\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'Expected exactly 1 WebView anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit minimal lifecycle fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/cetakpro/print/MainActivity.java
          git commit -m "Fix Device Admin lifecycle crash"
          git push
