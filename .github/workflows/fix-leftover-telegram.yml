name: Fix Leftover Telegram References

on:
  push:
    paths:
      - '.github/workflows/fix-leftover-telegram.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover Telegram bridge references
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('        if (telegramReporter != null) telegramReporter.sendEvent(title, message);\n', '')
          s = re.sub(r'\n\s*@JavascriptInterface\n\s*public String getTelegramStatus\(\) \{.*?\n\s*public void setTelegramEnabled\(boolean enabled\) \{.*?\n\s*\}\n', '\n', s, count=1, flags=re.S)
          if 'telegramReporter' in s:
              raise SystemExit('telegramReporter reference still remains')
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/cetakpro/print/MainActivity.java
          git commit -m 'Remove leftover Telegram bridge references'
          git push
