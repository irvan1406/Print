name: Restore WebView Navigation

on:
  push:
    paths:
      - '.github/workflows/restore-webview-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original in-app navigation behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          pattern = r'''(?ms)(\s*)Uri uri = request\.getUrl\(\);\s*String scheme = uri\.getScheme\(\);\s*if \(scheme != null && \(scheme\.equalsIgnoreCase\("http"\) \|\| scheme\.equalsIgnoreCase\("https"\)\)\) \{\s*view\.loadUrl\(uri\.toString\(\)\);\s*return true;\s*\}\s*return false;'''

          m = re.search(pattern, s)
          if not m:
              raise SystemExit('Current WebView navigation block not found')

          i = m.group(1)
          replacement = (
              i + 'Uri uri = request.getUrl();\n' +
              i + 'String host = uri.getHost();\n' +
              i + 'if (host != null && (host.equals("irvanmaulana.my.id") || host.endsWith(".jsdelivr.net"))) return false;\n' +
              i + 'try {\n' +
              i + '    startActivity(new Intent(Intent.ACTION_VIEW, uri));\n' +
              i + '    return true;\n' +
              i + '} catch (Exception ignored) {\n' +
              i + '    return false;\n' +
              i + '}'
          )
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding='utf-8')

      - name: Commit navigation restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/cetakpro/print/MainActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore original in-app WebView navigation"
          git push
