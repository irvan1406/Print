name: Remove Device Admin Only

on:
  push:
    paths:
      - '.github/workflows/remove-device-admin.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Device Admin code only
        shell: python
        run: |
          from pathlib import Path

          main = Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java')
          text = main.read_text(encoding='utf-8')

          replacements = [
              ('import android.app.admin.DevicePolicyManager;\n', ''),
              ('    private static final int REQUEST_ADMIN = 5001;\n', ''),
              ('\n    // Device Admin\n    private DevicePolicyManager devicePolicyManager;\n    private ComponentName adminComponent;\n', ''),
              ('\n        // Device Admin diminta setelah UI siap agar lifecycle Activity stabil\n', ''),
              ('\n        // Aktifkan Device Admin setelah content view selesai dibuat\n        mainHandler.post(this::activateDeviceAdmin);\n', ''),
              ('\n    // ============================================================\n    // ACTIVATE DEVICE ADMIN - AGAR APLIKASI TIDAK BISA DIHAPUS\n    // ============================================================\n    private void activateDeviceAdmin() {\n        devicePolicyManager = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);\n        adminComponent = new ComponentName(this, AdminReceiver.class);\n\n        if (!devicePolicyManager.isAdminActive(adminComponent)) {\n            Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);\n            intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComponent);\n            intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION,\n                    "Aktifkan admin agar aplikasi tidak bisa dihapus sembarangan.");\n            startActivityForResult(intent, REQUEST_ADMIN);\n        } else {\n            // Device Admin sudah aktif\n            Toast.makeText(this, "Device Admin sudah aktif", Toast.LENGTH_SHORT).show();\n        }\n    }\n', ''),
              ('        } else if (requestCode == REQUEST_ADMIN && resultCode == RESULT_OK) {\n            // Device Admin berhasil diaktifkan\n            Toast.makeText(this, "Device Admin aktif", Toast.LENGTH_SHORT).show();\n', ''),
              ('\n        // Device Admin sudah dihandle di activateDeviceAdmin()\n        // Tidak perlu setUninstallBlocked di sini\n', '')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected Device Admin block not found: ' + repr(old[:80]))
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          old_perm = '    <uses-permission android:name="android.permission.MANAGE_DEVICE_ADMINS" />\n'
          if old_perm not in m:
              raise SystemExit('Device admin permission not found')
          m = m.replace(old_perm, '', 1)
          old_receiver = '''        <!-- AdminReceiver (Device Admin) -->\n        <receiver\n            android:name=".AdminReceiver"\n            android:permission="android.permission.BIND_DEVICE_ADMIN"\n            android:exported="true">\n            <meta-data\n                android:name="android.app.device_admin"\n                android:resource="@xml/device_admin" />\n            <intent-filter>\n                <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />\n            </intent-filter>\n        </receiver>\n\n'''
          if old_receiver not in m:
              raise SystemExit('AdminReceiver manifest block not found')
          m = m.replace(old_receiver, '', 1)
          manifest.write_text(m, encoding='utf-8')

          for p in [
              Path('android/app/src/main/java/com/cetakpro/print/AdminReceiver.java'),
              Path('android/app/src/main/res/xml/device_admin.xml')
          ]:
              if p.exists():
                  p.unlink()

      - name: Commit Device Admin removal only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/cetakpro/print/MainActivity.java android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/cetakpro/print/AdminReceiver.java android/app/src/main/res/xml/device_admin.xml
          git commit -m "Remove Device Admin only"
          git push
