name: Fix Logo Preview And Print

on:
  push:
    paths:
      - '.github/workflows/fix-logo-print.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply logo preview and thermal print fix
        run: python .github/scripts/fix_logo_print.py

      - name: Commit logo fix only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html android/app/src/main/java/com/cetakpro/print/MainActivity.java
          git commit -m "Fix receipt logo preview and thermal printing"
          git push
