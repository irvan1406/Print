name: Fix Device Admin Crash

on:
  push:
    paths:
      - '.github/workflows/fix-device-admin-crash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unsupported uninstall-block calls only
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/java/com/cetakpro/print/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          target = 'devicePolicyManager.setUninstallBlocked(adminComponent, getPackageName(), true);'
          count = text.count(target)
          if count == 0:
              raise SystemExit('Target setUninstallBlocked call not found')
          text = text.replace(target, '// Device Admin aktif; setUninstallBlocked membutuhkan Device Owner/Profile Owner')
          path.write_text(text, encoding='utf-8')
          print(f'Removed {count} unsupported setUninstallBlocked call(s)')

      - name: Commit minimal fix
        run: |
          if git diff --quiet -- android/app/src/main/java/com/cetakpro/print/MainActivity.java; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/cetakpro/print/MainActivity.java
          git commit -m "Fix Device Admin return crash"
          git push
